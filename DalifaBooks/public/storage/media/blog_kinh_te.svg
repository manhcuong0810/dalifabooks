  <!-- Author Tag -->
  <text x="60" y="380" font-size="16" font-family="Arial, sans-serif" font-weight="bold" fill="#a7f3d0">Chuyên mục: Tài chính cá nhân • DalifaBooks Tuyển Chọn</text>
  <!-- Chart visual -->
  <g transform="translate(560, 150)">
    <rect x="0" y="90" width="30" height="100" rx="6" fill="#34d399"/>
