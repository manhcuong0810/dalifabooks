<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="60%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg3)"/>
  <!-- Badge -->
  <rect x="60" y="50" width="160" height="34" rx="17" fill="#10b981"/>
  <text x="140" y="72" font-size="14" font-family="Arial, sans-serif" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">GÓC BẠN ĐỌC</text>
  <!-- Book Title -->
  <text x="60" y="160" font-size="40" font-family="Arial, sans-serif" font-weight="bold" fill="#ffffff">5 CUỐN SÁCH KINH TẾ</text>
  <text x="60" y="205" font-size="22" font-family="Arial, sans-serif" fill="#a7f3d0">Đột phá tư duy tài chính &amp; quản trị đầu tư năm 2026</text>
  <!-- Excerpt quote -->
  <rect x="60" y="240" width="4" height="60" fill="#6ee7b7"/>
  <text x="80" y="265" font-size="16" font-family="Arial, sans-serif" font-style="italic" fill="#d1fae5">Tâm Lý Học Về Tiền • Cha Giàu Cha Nghèo • Tư Duy Nhanh Và Chậm</text>
