<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="60%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg2)"/>
  <circle cx="680" cy="120" r="150" fill="#fbbf24" opacity="0.2"/>
  <!-- Badge -->
  <rect x="60" y="50" width="160" height="34" rx="17" fill="#d97706"/>
  <text x="140" y="72" font-size="14" font-family="Arial, sans-serif" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">ĐIỂM SÁCH HAY</text>
  <!-- Book Title -->
  <text x="60" y="160" font-size="42" font-family="Arial, sans-serif" font-weight="bold" fill="#ffffff">NHÀ GIẢ KIM</text>
  <text x="60" y="205" font-size="22" font-family="Arial, sans-serif" fill="#fde68a">Hành trình tìm kiếm vận mệnh và kho báu cuộc đời</text>
  <!-- Excerpt quote -->
  <rect x="60" y="240" width="4" height="60" fill="#fbbf24"/>
  <text x="80" y="265" font-size="16" font-family="Arial, sans-serif" font-style="italic" fill="#fed7aa">"Khi bạn khao khát một điều gì đó,</text>
  <text x="80" y="292" font-size="16" font-family="Arial, sans-serif" font-style="italic" fill="#fed7aa">cả vũ trụ sẽ hợp lực giúp bạn đạt được điều đó."</text>
  <!-- Author Tag -->
  <text x="60" y="380" font-size="16" font-family="Arial, sans-serif" font-weight="bold" fill="#fbbf24">Tác giả: Paulo Coelho • Chàng chăn cừu Santiago</text>
  <!-- Pyramid Silhouette -->
  <g transform="translate(530, 160)">
    <polygon points="120,40 20,180 220,180" fill="#78350f" opacity="0.7"/>
    <polygon points="120,40 220,180 180,180" fill="#92400e" opacity="0.9"/>
    <!-- Desert moon -->
    <circle cx="120" cy="0" r="28" fill="#fef08a"/>
  </g>
</svg>