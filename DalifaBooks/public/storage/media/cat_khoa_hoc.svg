    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#bg_kh)"/>
  <!-- Atom orbits -->
  <ellipse cx="60" cy="60" rx="42" ry="16" fill="none" stroke="#38bdf8" stroke-width="3" transform="rotate(30 60 60)"/>
  <ellipse cx="60" cy="60" rx="42" ry="16" fill="none" stroke="#0284c7" stroke-width="3" transform="rotate(-30 60 60)"/>
  <ellipse cx="60" cy="60" rx="42" ry="16" fill="none" stroke="#818cf8" stroke-width="3" transform="rotate(90 60 60)"/>
