<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 40" width="420" height="40" fill="none">
    <!-- VISA -->
    <g transform="translate(0, 4)">
        <rect width="60" height="32" rx="4" fill="#1A1F71"/>
        <text x="30" y="21" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="14" font-style="italic" text-anchor="middle">VISA</text>
    </g>
    <!-- MasterCard -->
    <g transform="translate(70, 4)">
        <rect width="60" height="32" rx="4" fill="#252525"/>
        <circle cx="24" cy="16" r="10" fill="#EB001B"/>
        <circle cx="36" cy="16" r="10" fill="#F79E1B" fill-opacity="0.9"/>
    </g>
    <!-- PayPal -->
    <g transform="translate(140, 4)">
        <rect width="60" height="32" rx="4" fill="#003087"/>
        <text x="30" y="21" fill="#0079C1" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="12" font-style="italic" text-anchor="middle">Pay<tspan fill="#00457C">Pal</tspan></text>
    </g>
    <!-- American Express -->
    <g transform="translate(210, 4)">
        <rect width="60" height="32" rx="4" fill="#016FD0"/>
        <text x="30" y="20" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="9" text-anchor="middle">AMEX</text>
    </g>
    <!-- Maestro -->
    <g transform="translate(280, 4)">
        <rect width="60" height="32" rx="4" fill="#252525"/>
        <circle cx="24" cy="16" r="10" fill="#EB001B"/>
        <circle cx="36" cy="16" r="10" fill="#0099DF" fill-opacity="0.9"/>
    </g>
    <!-- Discover -->
    <g transform="translate(350, 4)">
        <rect width="60" height="32" rx="4" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
        <text x="30" y="20" fill="#FF6000" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="9" text-anchor="middle">DISCOVER</text>
    </g>
</svg>
