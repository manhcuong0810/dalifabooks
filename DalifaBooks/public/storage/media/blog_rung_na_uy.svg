<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg4)"/>
  <!-- Badge -->
  <rect x="60" y="50" width="200" height="34" rx="17" fill="#6366f1"/>
  <text x="160" y="72" font-size="14" font-family="Arial, sans-serif" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">TÁC GIẢ &amp; TÁC PHẨM</text>
  <!-- Book Title -->
  <text x="60" y="160" font-size="42" font-family="Arial, sans-serif" font-weight="bold" fill="#ffffff">RỪNG NA UY (NORWEGIAN WOOD)</text>
  <text x="60" y="205" font-size="22" font-family="Arial, sans-serif" fill="#c7d2fe">Bản tình ca da diết về tuổi trẻ, mất mát và hy vọng</text>
  <!-- Excerpt quote -->
  <rect x="60" y="240" width="4" height="60" fill="#a5b4fc"/>
  <text x="80" y="265" font-size="16" font-family="Arial, sans-serif" font-style="italic" fill="#e0e7ff">"Cái chết không phải là đối nghịch của sự sống,</text>
  <text x="80" y="292" font-size="16" font-family="Arial, sans-serif" font-style="italic" fill="#e0e7ff">mà là một phần nằm ngay trong lòng sự sống."</text>
  <!-- Author Tag -->
  <text x="60" y="380" font-size="16" font-family="Arial, sans-serif" font-weight="bold" fill="#c7d2fe">Đại văn hào: Haruki Murakami • Văn học Nhật Bản kinh điển</text>
  <!-- Forest silhouette -->
  <g transform="translate(560, 160)" fill="#4f46e5" opacity="0.6">
    <polygon points="30,180 30,80 50,110 50,50 70,80 70,20 90,80 90,50 110,110 110,80 110,180"/>
    <polygon points="110,180 110,90 125,120 125,60 145,100 145,40 165,100 165,70 180,120 180,180"/>
  </g>
</svg>