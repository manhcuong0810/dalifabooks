<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg1)"/>
  <circle cx="700" cy="100" r="220" fill="#0284c7" opacity="0.15"/>
  <circle cx="100" cy="380" r="180" fill="#f59e0b" opacity="0.1"/>
  <!-- Badge -->
  <rect x="60" y="50" width="160" height="34" rx="17" fill="#0068e1"/>
  <text x="140" y="72" font-size="14" font-family="Arial, sans-serif" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">ĐIỂM SÁCH HAY</text>
  <!-- Book Title -->
  <text x="60" y="160" font-size="42" font-family="Arial, sans-serif" font-weight="bold" fill="#ffffff">ĐẮC NHÂN TÂM</text>
  <text x="60" y="205" font-size="22" font-family="Arial, sans-serif" fill="#38bdf8">Nghệ thuật thu phục lòng người &amp; Giá trị vượt thời gian</text>
  <!-- Excerpt quote -->
  <rect x="60" y="240" width="4" height="60" fill="#f59e0b"/>
  <text x="80" y="265" font-size="16" font-family="Arial, sans-serif" font-style="italic" fill="#cbd5e1">"Biết lắng nghe, thấu cảm và thành thật ngợi khen người khác</text>
  <text x="80" y="292" font-size="16" font-family="Arial, sans-serif" font-style="italic" fill="#cbd5e1">là chìa khóa vạn năng mở lối đến thành công."</text>
  <!-- Author Tag -->
  <text x="60" y="380" font-size="16" font-family="Arial, sans-serif" font-weight="bold" fill="#f59e0b">Tác giả: Dale Carnegie • DalifaBooks Review</text>
  <!-- Graphic Book Silhouette -->
  <g transform="translate(560, 110)">
    <rect x="0" y="0" width="160" height="230" rx="10" fill="#1e3a8a" stroke="#3b82f6" stroke-width="3"/>
    <rect x="15" y="20" width="130" height="190" rx="6" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="80" y="90" font-size="20" font-family="Arial, sans-serif" font-weight="bold" fill="#f59e0b" text-anchor="middle">ĐẮC</text>
    <text x="80" y="120" font-size="20" font-family="Arial, sans-serif" font-weight="bold" fill="#f59e0b" text-anchor="middle">NHÂN TÂM</text>
    <line x1="40" y1="140" x2="120" y2="140" stroke="#f59e0b" stroke-width="2"/>
    <text x="80" y="165" font-size="12" font-family="Arial, sans-serif" fill="#93c5fd" text-anchor="middle">DALE CARNEGIE</text>
  </g>
</svg>