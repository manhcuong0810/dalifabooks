services:

  # PostgreSQL — database chính
  postgres:
    image: postgres:16-alpine
    container_name: dalifabooks_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dalifabooks
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: dalifabooks_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dalifabooks -d dalifabooks_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Mailpit — xem email dev tại http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: dalifabooks_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
